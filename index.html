<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FireArena MAX - Esports Tournaments</title>
    <meta name="description" content="Premier Free Fire MAX esports tournament platform featuring dual wallet deposit & winnings, instant UPI & Google Play redeem code withdrawals, and real-time custom room matching." />
    <meta property="og:title" content="FireArena MAX - Esports Tournaments" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fire Arena Pro" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <style>
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.9; }
        100% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 25px rgba(234,179,8,0.65)); }
      }
    </style>
    <!-- Google Fonts for Cyberpunk & Gaming typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#000000] text-slate-100 antialiased selection:bg-red-600 selection:text-white min-h-screen overflow-x-hidden">
    <div id="pwa-splash" style="position:fixed;inset:0;background:#0b0c10;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999999;">
      <img src="/logo.png" alt="Fire Arena Pro" style="width:130px;height:130px;object-fit:contain;filter:drop-shadow(0 0 15px rgba(234,179,8,0.4));animation:pulse 1.5s infinite alternate;" />
      <p style="margin-top:16px;color:#eab308;font-weight:800;letter-spacing:2px;font-family:sans-serif;">FIRE ARENA PRO</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('[PWA] Service Worker registered with scope:', registration.scope);
            })
            .catch(function(error) {
              console.warn('[PWA] Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
